new GLTFLoader().load(MODEL_URL,gltf=>{try{gltf.scene.updateMatrixWorld(true);const parts=[];gltf.scene.traverse(obj=>{if(!obj.isMesh)return;let g=obj.geometry.clone();['uv','color','tangent','uv1','uv2'].forEach(key=>g.deleteAttribute(key));g=mergeVertices(g,1e-4);g.computeVertexNormals();g.applyMatrix4(obj.matrixWorld);parts.push(g);});if(!parts.length)throw Error('No geometry');const merged=mergeGeometries(parts,false);if(!merged)throw Error('Merge failed');installGeometry(merged);}catch(e){console.warn('Model fallback',e);installGeometry(new RoundedBoxGeometry(1,1,1,8,.12));}},undefined,()=>installGeometry(new RoundedBoxGeometry(1,1,1,8,.12)));
function drawHeadline(){textCanvas.width=Math.round(W*dpr);textCanvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);let fontSize=Math.min(H*.21,W*(mobile?.21:.118));ctx.font=`800 ${fontSize}px Poppins`;const width=Math.max(...['Explore','New','Ideas'].map(line=>ctx.measureText(line).width));fontSize*=Math.min(1,W*(mobile?.9:.5)/width);ctx.font=`800 ${fontSize}px Poppins`;ctx.fillStyle='#e9e9e9';ctx.textAlign='center';ctx.textBaseline='alphabetic';const cx=W*(mobile?.5:.505),cy=H*(mobile?.45:.468),gap=fontSize*1.07;['Explore','New','Ideas'].forEach((line,i)=>ctx.fillText(line,cx,cy+fontSize*.35+(i-1)*gap));background.needsUpdate=true;}

let dragging=false,lastX=0,lastY=0,velocityX=0,velocityY=0,spinRemaining=0,lastRelease=performance.now()-2000;
const qY=new THREE.Quaternion(),qX=new THREE.Quaternion();function rotate(dx,dy){qY.setFromAxisAngle(new THREE.Vector3(0,1,0),dx);qX.setFromAxisAngle(new THREE.Vector3(1,0,0),dy);spinner.quaternion.premultiply(qY).premultiply(qX);}
